<!DOCTYPE html>
<html lang="mn">
<head>
    <script src="shared-store.js" defer></script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Жаргалан СӨБ Систем - Урилгаар Эрх Идэвхжүүлэх</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background: linear-gradient(135deg, #f0f4ff 0%, #fef2f2 100%); }
        .glass-card { background: rgba(255, 255, 255, 0.95); backdrop-filter: blur(10px); }
        .input-focus:focus { border-color: #6366f1; box-shadow: 0 0 0 4px rgba(99, 102, 241, 0.1); }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-4">

    <!-- Үндсэн Урилга идэвхжүүлэх хэсэг -->
    <div class="max-w-md w-full glass-card rounded-3xl shadow-xl border border-white/80 p-8 relative overflow-hidden">
        
        <!-- Чимэглэлийн дүрслэл -->
        <div class="absolute -top-10 -right-10 w-32 h-32 bg-indigo-100 rounded-full blur-xl opacity-70 pointer-events-none"></div>
        <div class="absolute -bottom-10 -left-10 w-32 h-32 bg-pink-100 rounded-full blur-xl opacity-70 pointer-events-none"></div>

        <!-- Лого болон гарчиг -->
        <div class="text-center mb-6 relative">
            <div class="w-16 h-16 bg-gradient-to-tr from-indigo-600 to-pink-500 text-white text-2xl rounded-2xl mx-auto flex items-center justify-center shadow-lg shadow-indigo-200 mb-3">
                💌
            </div>
            <h1 class="text-xl font-extrabold text-gray-800">Урилгаар Эрх Идэвхжүүлэх</h1>
            <p class="text-xs text-gray-500 mt-1">Цэцэрлэг эсвэл багшийн илгээсэн урилгын кодоор нэвтрэх</p>
        </div>

        <!-- Алхам 1: Урилгын код шалгах форм -->
        <div id="step1" class="space-y-4 relative text-xs">
            <div>
                <label class="block font-bold text-gray-700 mb-1">Урилгын код эсвэл холбоос</label>
                <div class="relative">
                    <span class="absolute inset-y-0 left-0 flex items-center pl-3.5 text-gray-400">
                        <i class="fa-solid fa-key text-xs"></i>
                    </span>
                    <input type="text" id="inviteCode" placeholder="Жашээ нь: JARGALAN-INV-9922" 
                        class="w-full pl-10 pr-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl text-xs text-gray-800 outline-none input-focus transition">
                </div>
            </div>

            <button onclick="verifyInviteCode()" class="w-full bg-indigo-600 hover:bg-indigo-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-indigo-200 transition transform active:scale-98">
                Урилга шалгах 🚀
            </button>
        </div>

        <!-- Алхам 2: Код зөв болсны дараа нууц үг үүсгэх форм (Эхэндээ нууцлагдсан байна) -->
        <div id="step2" class="space-y-4 relative text-xs hidden">
            <div class="p-3 bg-indigo-50 rounded-2xl border border-indigo-100 text-indigo-700 text-center font-semibold">
                ✨ Урилга амжилттай баталгаажлаа! (Эрх: Эцэг эх / Бэлтгэл бүлэг)
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Утасны дугаар эсвэл Gmail (Баталгаажуулах)</label>
                <input type="text" id="userContact" placeholder="99112233 эсвэл email@gmail.com" 
                    class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl outline-none input-focus transition">
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Шинэ нууц үг үүсгэх</label>
                <input type="password" id="newPass" placeholder="••••••••" 
                    class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl outline-none input-focus transition">
            </div>

            <div>
                <label class="block font-bold text-gray-700 mb-1">Нууц үг давтах</label>
                <input type="password" id="confirmPass" placeholder="••••••••" 
                    class="w-full px-4 py-3 bg-gray-50/50 border border-gray-200 rounded-2xl outline-none input-focus transition">
            </div>

            <button onclick="completeActivation()" class="w-full bg-emerald-600 hover:bg-emerald-700 text-white font-bold py-3.5 rounded-2xl shadow-lg shadow-emerald-200 transition transform active:scale-98">
                Эрхийг идэвхжүүлж, нэвтрэх 🎉
            </button>
        </div>

        <!-- Буцах холбоос -->
        <div class="mt-6 pt-5 border-t border-gray-100 text-center relative text-xs">
            <a href="login.html" class="text-indigo-600 font-bold hover:underline">
                <i class="fa-solid fa-arrow-left mr-1"></i> Нэвтрэх хэсэг рүү буцах
            </a>
        </div>

    </div>

    <!-- JavaScript логик -->
    <script>
        function verifyInviteCode() {
            const code = document.getElementById('inviteCode').value.trim();
            if(!code) {
                alert('Урилгын кодоо оруулна уу!');
                return;
            }

            // Код шалгах түр дуураймал урсгал
            alert('Урилгын код олдлоо. Та одоо өөрийн нууц үгээ үүсгэнэ үү.');
            document.getElementById('step1').classList.add('hidden');
            document.getElementById('step2').classList.remove('hidden');
        }

        function completeActivation() {
            const pass = document.getElementById('newPass').value;
            const confirmPass = document.getElementById('confirmPass').value;

            if(!pass || pass !== confirmPass) {
                alert('Нууц үг хоорондоо таарахгүй эсвэл хоосон байна!');
                return;
            }

            alert('Таны эрх амжилттай идэвхжлээ! Систем рүү нэвтэрч байна.');
            window.location.href = 'index.html';
        }
    </script>
</body>
</html>
